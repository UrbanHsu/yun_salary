<title>惠韻每月回饋</title>
<link rel="icon" type="image/png" sizes="192x192" href="form-icon-192.png">
<link rel="apple-touch-icon" href="form-apple-touch-icon.png">
<link rel="manifest" href="form.webmanifest">

<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eef1f3; --line:#dde3e7;
  --fg:#1b2529; --muted:#5f6f78; --accent:#0f7b7b; --accent-fg:#ffffff;
  --warn:#b4690e; --good:#2f7d46; --danger:#b23b3b;
  --shadow:0 1px 2px rgba(16,40,48,.06),0 2px 8px rgba(16,40,48,.05);
  --cell-fill:#fff8e6; --self:#e9edef;
  --sky1:#e7f3ff; --sky2:#f4f6f7; --ink:#1b2529; --ink-use:var(--ink); --page-bg:var(--sky2); --halo:var(--halo-s,var(--sky1)); --scene-filter:none;
  --glass:color-mix(in srgb,var(--surface) 84%,transparent);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1618; --surface:#172124; --surface-2:#1d292d; --line:#2a393e;
  --fg:#e7eef0; --muted:#95a7ae; --accent:#2bb3ac; --accent-fg:#06211f;
  --warn:#e0a048; --good:#5fc27e; --danger:#e07a7a; --shadow:0 1px 2px rgba(0,0,0,.3);
  --cell-fill:#2a2415; --self:#202c30; color-scheme:dark;
  --ink-use:#eef3f1; --page-bg:color-mix(in srgb,var(--sky2) 12%,#0f1618); --halo:rgba(0,0,0,.55); --scene-filter:brightness(.5) saturate(.85);
  --glass:color-mix(in srgb,var(--surface) 82%,transparent);
}}
:root[data-theme="dark"]{
  --bg:#0f1618; --surface:#172124; --surface-2:#1d292d; --line:#2a393e;
  --fg:#e7eef0; --muted:#95a7ae; --accent:#2bb3ac; --accent-fg:#06211f;
  --warn:#e0a048; --good:#5fc27e; --danger:#e07a7a; --shadow:0 1px 2px rgba(0,0,0,.3);
  --cell-fill:#2a2415; --self:#202c30; color-scheme:dark;
  --ink-use:#eef3f1; --page-bg:color-mix(in srgb,var(--sky2) 12%,#0f1618); --halo:rgba(0,0,0,.55); --scene-filter:brightness(.5) saturate(.85);
  --glass:color-mix(in srgb,var(--surface) 82%,transparent);
}
*{box-sizing:border-box}
body{background:var(--page-bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2{margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.brand{font-weight:700;font-size:16px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.sp{flex:1}
.theme-btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:12px}

.wrap{max-width:880px;margin:0 auto;padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.card h2{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:0 1 130px}
.field.wide{flex-basis:220px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.mini{padding:5px 11px;font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:12px;color:var(--muted)}

/* season backdrop — the 節氣 scene is the page's own ground; content floats over it */
.stage{position:absolute;left:0;right:0;top:0;height:var(--stage-h);z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));filter:var(--scene-filter)}
:root{--stage-h:clamp(400px,42vw,500px)}
.stage svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:78%;display:block}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--sky1) 0%,color-mix(in srgb,var(--sky1) 60%,transparent) 30%,transparent 58%)}
.stage-fade{position:absolute;left:0;right:0;top:calc(var(--stage-h) - 130px);height:130px;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent,var(--page-bg))}
.wrap{position:relative;z-index:1}
.hero{min-height:clamp(170px,22vw,230px);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 6px 0;color:var(--ink-use);text-shadow:0 1px 14px var(--halo),0 0 2px var(--halo)}
.mh-yr{font-size:12.5px;letter-spacing:.14em;font-weight:600;opacity:.85}
.mh-mo{font-size:78px;font-weight:800;line-height:.92;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mh-mo small{font-size:22px;font-weight:700;margin-left:6px;letter-spacing:.06em}
.mh-terms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mh-term{font-size:12px;font-weight:700;letter-spacing:.2em;padding:3px 8px 3px 10px;border-radius:999px;text-shadow:none;background:color-mix(in srgb,var(--ink-use) 12%,transparent);border:1px solid color-mix(in srgb,var(--ink-use) 28%,transparent)}
.mh-tag{font-size:14px;font-weight:600;letter-spacing:.1em;margin-top:2px}
main .intro{color:var(--ink-use);text-shadow:0 1px 10px var(--halo),0 0 2px var(--halo)}
main .intro .msg{color:inherit}main .intro .due{color:inherit;opacity:.85}main .intro .due b{color:inherit;opacity:1}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;top:-4%;display:block;animation:fall var(--d) linear var(--dl) infinite}
.fx.up i{top:auto;bottom:-4%;animation-name:rise}
.fx.tw i{top:var(--y);animation-name:twinkle}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sw),55vh) rotate(180deg)}100%{transform:translate(0,110vh) rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--sw),-110vh);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@media(max-width:520px){:root{--stage-h:400px}.stage svg{height:62%}.mh-mo{font-size:64px}.mh-mo small{font-size:18px}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}

.intro{display:flex;flex-direction:column;gap:6px;padding-inline:6px;margin-top:-2px}
.intro .msg{font-size:15.5px;line-height:1.75;white-space:pre-wrap;color:var(--fg);margin:0;text-wrap:pretty}
.intro .due{font-size:13px;color:var(--muted);margin:0}
.intro .due b{color:var(--accent);font-weight:700}

/* ===== 牙科填單元件（沿用內科填單的色票與質感） ===== */
.hello{font-size:15.5px;line-height:1.75}
.hello b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.chip .ok{font-size:11px;color:var(--good);margin-left:6px;font-weight:700}
.chip[aria-pressed="true"] .ok{color:var(--accent-fg)}
.field{flex:1 1 200px}
.field input{font-size:15px}
textarea{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px 12px;width:100%;min-height:92px;resize:vertical;line-height:1.6;font-family:inherit;font-size:15px}
input[type=text]{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:9px 11px;width:100%;font-family:inherit;font-size:14px}
.err{color:var(--danger);font-size:13.5px;margin-top:8px}
.err:empty{display:none}
.note{color:var(--accent);font-weight:700;font-size:14px;margin-top:12px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:9px 0;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.scale-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.peer{border-top:1px dashed var(--line);padding:14px 0 10px}
.peer:first-of-type{border-top:0;padding-top:4px}
.peer .nm{font-weight:700;margin-bottom:8px}
.peer input[type=text]{margin-top:8px}
.talk{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.talk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.talk b{display:block}
.talk span{font-size:13px;color:var(--muted)}
.done{display:flex;gap:14px;align-items:center}
.done .ic{font-size:34px}
.done b{color:var(--good);font-size:17px}
.sendbar{position:sticky;bottom:0;padding:16px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--page-bg) 35%)}
.sendbar .in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.privacy{font-size:12.5px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media(max-width:420px){.scale button{padding:8px 0;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in"><img class="logo" src="form-icon-192.png" alt="" style="background:none;object-fit:cover">
  <div class="brand">惠韻每月回饋 <small>惠韻牙醫 · 自評 · 互評 · 想說的話</small></div><div class="sp"></div>
  <button class="theme-btn" id="themeBtn" type="button">切換深色</button></div></div>
<div class="stage" id="stage" aria-hidden="true"></div><div class="stage-fade" aria-hidden="true"></div><div id="fxLayer"></div>
<main class="wrap">
  <div class="hero" id="hero"></div>
  <div class="intro"><p class="msg hello" id="hello"></p></div>
  <section class="card" id="loginCard" hidden></section>
  <div id="formArea" hidden style="display:flex;flex-direction:column;gap:16px"></div>
  <section class="card" id="doneCard" hidden></section>
  <p class="privacy">你填的內容只有劉醫師看得到，同事看不到彼此的評分。</p>
</main>
<div class="toast" id="toast" role="status"></div>

    <ellipse cx="0" cy="-34" rx="70" ry="14" fill="#fbe7d9"/>${[[-30,-38,"#ffffff"],[-6,-42,"#f7b6c8"],[18,-38,"#ffffff"],[38,-40,"#f7b6c8"],[6,-32,"#ffffff"]].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="11" fill="${c}" stroke="#e9d6cc" stroke-width="1"/>`).join("")}

};
const FX={
  snow:i=>`width:${4+i%4*2}px;height:${4+i%4*2}px;border-radius:50%;background:#fff;opacity:.9`,
  petal:i=>`width:9px;height:6px;border-radius:60% 0 60% 0;background:${i%2?"#f7a8c4":"#fbd0dc"}`,
  blossom:i=>`width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)`,
  leaf:i=>`width:12px;height:7px;border-radius:70% 0 70% 0;background:${["#f2731d","#d9542b","#e8a23a"][i%3]}`,
  rain:i=>`width:1.5px;height:14px;background:rgba(80,130,110,.45)`,
  seed:i=>`width:10px;height:3px;border-radius:2px;background:#f6eddc;opacity:.9`,
  spark:i=>`width:5px;height:5px;border-radius:50%;background:${i%2?"#ffd36e":"#ff9d5c"}`,
  bubble:i=>`width:${6+i%3*3}px;height:${6+i%3*3}px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)`,
  firefly:i=>`width:5px;height:5px;border-radius:50%;background:#fff6a8;box-shadow:0 0 8px 3px rgba(255,236,140,.7)`,
  star:i=>`width:${2+i%3}px;height:${2+i%3}px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.6)`
};
function fxHtml(f){
  const mode=f.type==="bubble"||f.type==="firefly"?"up":f.type==="star"?"tw":"";
  let h="";for(let i=0;i<f.n;i++){
    const left=(i*37+11)%100, d=f.type==="rain"?1.1+(i%4)*.25:7+(i*13%9), dl=-(i*1.7%d), sw=((i%2?1:-1)*(10+i*7%30))+"px", y=(i*29%55)+"%";
    h+=`<i style="left:${left}%;--d:${d}s;--dl:${dl.toFixed(1)}s;--sw:${sw};--y:${y};${FX[f.type](i)}"></i>`;}
  return `<div class="fx ${mode}" aria-hidden="true">${h}</div>`;
}
function renderHero(sm,yr,mo){
  const t=SEASONS[sm]||SEASONS[1],r=document.documentElement.style;
  r.setProperty("--sky1",t.sky[0]);r.setProperty("--sky2",t.sky[1]);r.setProperty("--ink",t.ink);
  const night=sm===9;r.setProperty("--halo-s",night?"rgba(0,0,0,.35)":t.sky[0]);
  $("#stage").innerHTML=`<svg viewBox="0 0 800 240" preserveAspectRatio="xMaxYMax slice">${t.art()}</svg>`;
  $("#fxLayer").innerHTML=fxHtml(t.fx);
  const el=$("#hero");
  el.innerHTML=`<div class="mh-yr">${yr} 年 · 惠韻牙醫</div>
      <div class="mh-mo">${mo}<small>月回饋</small></div>
      <div class="mh-terms">${t.terms.map(x=>`<span class="mh-term">${x}</span>`).join("")}</div>
      <div class="mh-tag">${t.tag}</div>`;
  el.setAttribute("role","img");el.setAttribute("aria-label",`${yr} 年 ${mo} 月回饋　${t.terms.join("、")}　${t.tag}`);
}

renderHero(RM.m===12?1:RM.m+1,RM.y,RM.m);
(function(){const b=$("#themeBtn");const set=n=>{document.documentElement.setAttribute("data-theme",n);b.textContent=n==="dark"?"切換淺色":"切換深色";};
  try{const s=localStorage.getItem("hy_theme");if(s)set(s);}catch(e){}
  b.onclick=()=>{const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";set(n);try{localStorage.setItem("hy_theme",n)}catch(e){}};})();

firebase.initializeApp(FB_CONFIG);
const auth=firebase.auth(), db=firebase.firestore();
const S={roster:[],registry:{},status:{},sel:null,me:null,data:null};

/* ---------- 登入 ---------- */
async function loadPublic(){
  const [r,g,s]=await Promise.all([db.doc("meta/roster").get(),db.doc("meta/registry").get(),db.doc("formStatus/"+RM.key).get()]);
  S.roster=(r.exists&&r.data().people)||[];
  S.registry=(g.exists&&g.data())||{};
  S.status=(s.exists&&s.data().submitted)||{};
}
function renderLogin(){
  const c=$("#loginCard"); c.hidden=false; $("#formArea").hidden=true; $("#doneCard").hidden=true;
  $("#hello").textContent=`${RM.m} 月辛苦了！花幾分鐘回顧一下這個月吧。`;
  if(!S.roster.length){c.innerHTML=`<h2>系統準備中</h2><div class="sub">名單還沒建立，請稍後再試，或洽劉醫師。</div>`;return;}
  const sel=S.sel&&S.roster.find(p=>p.id===S.sel), first=sel&&!S.registry[sel.id];
  c.innerHTML=`<h2>登入</h2><div class="sub">先選你的名字，再輸入密碼。</div>
    <div class="chips">${S.roster.map(p=>`<button type="button" class="chip" data-p="${esc(p.id)}" aria-pressed="${S.sel===p.id}">${esc(p.name)}${S.status[p.id]?'<span class="ok">✓ 已填</span>':""}</button>`).join("")}</div>
    ${!sel?"":first?`<div class="note">${esc(sel.name)}，第一次使用，請設定你的密碼</div>
      <div class="row" style="margin-top:10px"><div class="field"><label for="p1">設定密碼</label><input id="p1" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="p2">再輸入一次</label><input id="p2" type="password" autocomplete="new-password"></div>
      <button class="btn primary" id="go" type="button">設定並進入</button></div>`
    :`<div class="row" style="margin-top:14px"><div class="field"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" placeholder="輸入你的密碼"></div>
      <button class="btn primary" id="go" type="button">進入</button></div>
      <button class="btn ghost mini" id="forgot" type="button" style="margin-top:8px">忘記密碼？</button>`}
    <div class="err" id="lerr"></div>`;
  c.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.sel=b.dataset.p;renderLogin();(c.querySelector("#pw")||c.querySelector("#p1"))?.focus();});
  if(!sel)return;
  const err=t=>{$("#lerr").textContent=t;};
  const go=async()=>{
    const b=$("#go");b.disabled=true;
    try{
      if(first){
        const a=$("#p1").value,z=$("#p2").value;
        if(!a){err("請輸入你想用的密碼。");b.disabled=false;return;}
        if(a!==z){err("兩次輸入的密碼不一樣。");$("#p2").value="";b.disabled=false;return;}
        try{await auth.createUserWithEmailAndPassword(emailOf(sel.id),pwX(a));}
        catch(e){err(e.code==="auth/email-already-in-use"?"這個名字已經設定過密碼，請重新整理後用密碼登入。":"設定失敗，請確認網路後再試。");b.disabled=false;return;}
        try{await db.doc("meta/registry").set({[sel.id]:true},{merge:true});}catch(e){}
        toast("密碼已設定，下次請用這組密碼登入");
      }else{
        try{await auth.signInWithEmailAndPassword(emailOf(sel.id),pwX($("#pw").value));}
        catch(e){err(e.code==="auth/too-many-requests"?"嘗試太多次，請稍等幾分鐘再試。":"密碼不正確，請再試一次。");$("#pw").value="";b.disabled=false;return;}
      }
      S.me=sel; await openForm();
    }catch(e){err("發生錯誤："+(e.message||e));b.disabled=false;}
  };
  $("#go").onclick=go;
  c.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go();});
  const f=$("#forgot");if(f)f.onclick=()=>err("請找劉醫師幫你重設，重設後再登入一次就能設定新密碼。");
}

/* ---------- 填單 ---------- */
async function openForm(){
  const d=await db.doc(`forms/${RM.key}_${S.me.id.toLowerCase()}`).get();
  S.data=d.exists?d.data():{self:null,peers:{},peerNotes:{},best:"",worse:"",talk:false,talkTopic:""};
  S.data.peers=S.data.peers||{};S.data.peerNotes=S.data.peerNotes||{};
  renderForm();
}
const scaleHtml=(key,val)=>`<div class="scale" role="group">${Array.from({length:11},(_,i)=>`<button type="button" data-sc="${key}" data-v="${i}" aria-pressed="${val===i}">${i}</button>`).join("")}</div>
  <div class="scale-cap"><span>0 很不滿意</span><span>10 非常好</span></div>`;
function renderForm(){
  $("#loginCard").hidden=true;$("#doneCard").hidden=true;
  const me=S.me,D=S.data,others=S.roster.filter(p=>p.id!==me.id);
  $("#hello").innerHTML=`<b>${esc(me.name)}</b>，${RM.m} 月辛苦了！${S.status[me.id]?"你已經送出過，可以修改後再送一次。":""}`;
  const a=$("#formArea");a.hidden=false;
  a.innerHTML=`
  <section class="card"><h2>1. 我這個月的工作自評</h2><div class="sub">整體來說，你給自己這個月幾分？</div>${scaleHtml("self",D.self)}</section>
  <section class="card"><h2>2. 給同事的評分</h2><div class="sub">每位同事打一個總分；想說的話可以寫在下面（選填）。</div>
    ${others.map(p=>`<div class="peer"><div class="nm">${esc(p.name)}</div>${scaleHtml("p:"+p.id,D.peers[p.id]??null)}
      <input type="text" data-note="${esc(p.id)}" maxlength="100" placeholder="想對同事說的話（選填）" value="${esc(D.peerNotes[p.id]||"")}"></div>`).join("")||'<div class="sub">目前沒有其他同事。</div>'}
  </section>
  <section class="card"><h2>3. 這個月我覺得自己做得最好的一件事</h2><textarea id="best" maxlength="500" placeholder="例如：主動幫忙新同事熟悉流程…">${esc(D.best)}</textarea></section>
  <section class="card"><h2>4. 這個月我覺得自己做得比較不好的一件事</h2><textarea id="worse" maxlength="500" placeholder="例如：有一次器械準備不夠完整…">${esc(D.worse)}</textarea></section>
  <section class="card"><label class="talk"><input type="checkbox" id="talk" ${D.talk?"checked":""}><div><b>我想跟劉醫師聊一聊</b><span>勾選後劉醫師會找時間跟你聊，想聊的內容可以先寫在下面（選填）。</span></div></label>
    <textarea id="talkTopic" maxlength="300" placeholder="想聊的事（選填）" style="margin-top:10px" ${D.talk?"":"hidden"}>${esc(D.talkTopic||"")}</textarea></section>
  <div class="sendbar"><div class="in"><button class="btn primary" id="submit" type="button">送出</button><button class="btn ghost" id="logout" type="button">登出</button><span class="err" id="ferr"></span></div></div>`;
  a.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.sc,v=+b.dataset.v;
    if(k==="self")D.self=v; else D.peers[k.slice(2)]=v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  });
  a.querySelectorAll("[data-note]").forEach(i=>i.oninput=()=>{D.peerNotes[i.dataset.note]=i.value;});
  $("#best").oninput=e=>D.best=e.target.value;
  $("#worse").oninput=e=>D.worse=e.target.value;
  $("#talk").onchange=e=>{D.talk=e.target.checked;$("#talkTopic").hidden=!D.talk;};
  $("#talkTopic").oninput=e=>D.talkTopic=e.target.value;
  $("#logout").onclick=async()=>{await auth.signOut();S.me=null;S.sel=null;await loadPublic();renderLogin();scrollTo(0,0);};
  $("#submit").onclick=submit;
}
async function submit(){
  const D=S.data,me=S.me,others=S.roster.filter(p=>p.id!==me.id);
  $("#ferr").textContent="";
  const miss=[];
  if(D.self==null)miss.push("自評分");
  const noPeer=others.filter(p=>D.peers[p.id]==null);
  if(noPeer.length)miss.push("同事評分（"+noPeer.map(p=>p.name).join("、")+"）");
  if(!D.best.trim())miss.push("做得最好的一件事");
  if(!D.worse.trim())miss.push("做得比較不好的一件事");
  if(miss.length){$("#ferr").textContent="還沒填："+miss.join("、");toast("還有欄位沒填");return;}
  const b=$("#submit");b.disabled=true;b.textContent="送出中…";
  try{
    const peers={},notes={};
    others.forEach(p=>{peers[p.id]=D.peers[p.id];if((D.peerNotes[p.id]||"").trim())notes[p.id]=D.peerNotes[p.id].trim();});
    await db.doc(`forms/${RM.key}_${me.id.toLowerCase()}`).set({person:me.id,name:me.name,month:RM.key,self:D.self,peers,peerNotes:notes,
      best:D.best.trim(),worse:D.worse.trim(),talk:!!D.talk,talkTopic:D.talk?(D.talkTopic||"").trim():"",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    await db.doc("formStatus/"+RM.key).set({submitted:{[me.id]:true}},{merge:true});
    S.status[me.id]=true;
    $("#formArea").hidden=true;
    const dc=$("#doneCard");dc.hidden=false;
    dc.innerHTML=`<div class="done"><div class="ic">🌿</div><div><b>${esc(me.name)}，謝謝你！</b><div class="sub" style="margin:2px 0 0">${RM.m} 月的回饋已送出${D.talk?"，劉醫師會找時間跟你聊聊":""}。</div></div></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="edit" type="button">我要修改</button><button class="btn ghost" id="out" type="button">登出</button></div>`;
    $("#edit").onclick=()=>renderForm();
    $("#out").onclick=async()=>{await auth.signOut();S.me=null;S.sel=null;await loadPublic();renderLogin();};
    $("#hello").textContent="";scrollTo({top:0,behavior:"smooth"});
  }catch(e){$("#ferr").textContent="送出失敗，請確認網路後再試一次。";b.disabled=false;b.textContent="送出";}
}

(async()=>{
  try{await loadPublic();}catch(e){$("#loginCard").hidden=false;$("#loginCard").innerHTML=`<h2>連線失敗</h2><div class="sub">請確認網路後重新整理。</div>`;return;}
  await auth.signOut().catch(()=>{});
  renderLogin();
})();
</script>
